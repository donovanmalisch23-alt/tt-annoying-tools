[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-tt-media"
version = "0.1.0"
description = "A simple, robust TeamTalk 5 media player bot with YouTube, Spotify and Apple Music support."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "yt-dlp>=2024.1.0",
]

[project.optional-dependencies]
spotify = ["spotipy>=2.23.0"]
dev = ["pytest>=7.0"]

[project.scripts]
ttmedia = "ttmedia.__main__:main"

[tool.setuptools]
packages = ["ttmedia", "ttmedia.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Simple TT Media configuration.
# Secrets may instead be set via environment variables:
#   TTMEDIA_PASSWORD, TTMEDIA_CHANNEL_PASSWORD, TTMEDIA_SDK

log_level = "INFO"
log_file = ""

[server]
host = "teamtalk.example.com"
tcp_port = 10333
udp_port = 10333
encrypted = false
username = "mediabot"
password = ""
nickname = "MediaBot"
status_message = "Send me a private message with 'h' for help"
channel = "/"
channel_password = ""

[bot]
admins = ["your_teamtalk_username"]
channel_prefix = ""
reconnect_seconds = 5
announce_now_playing = true
rate_limit_per_10s = 8
command_workers = 6
max_user_queue = 100

[audio]
sample_rate = 48000
channels = 2
frame_ms = 20
lead_ms = 300
buffer_ms = 2500
default_volume = 100
max_volume = 200
max_track_seconds = 0
network_timeout = 15

[sources]
youtube = true
soundcloud = true
spotify = true
spotify_client_id = ""
spotify_client_secret = ""
applemusic = true
direct_url = true
max_search_results = 20
max_playlist_tracks = 500

[tools]
ffmpeg_path = ""
deno_path = ""

[sdk]
path = ""


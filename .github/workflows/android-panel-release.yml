name: Android panel APK

# Builds the web panel, bakes it into the Android wrapper's assets, assembles an
# APK and attaches it to a GitHub release — so testers get a download link
# instead of a build recipe. Run it from the Actions tab, or push a
# `panel-v*` tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (blank: panel-v<app versionName>)"
        required: false
        default: ""
  push:
    tags:
      - "panel-v*"

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish the panel APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the SDK platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # The wrapper has no Gradle wrapper checked in, so the runner supplies
      # Gradle. 8.9 is the version AGP 8.7 needs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build the panel and copy it into the APK assets
        run: |
          bun install --frozen-lockfile
          bun run android:assets

      # Signing is optional: without the secrets below the artifact is a
      # debug-signed APK, which sideloads fine for a tester group.
      - name: Collect the signing keystore if there is one
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret — building a debug-signed APK." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          mkdir -p android-panel/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-panel/keystore/release.jks

      - name: Assemble
        env:
          WEBBY_KEYSTORE: ${{ steps.keystore.outputs.signed == 'true' && 'keystore/release.jks' || '' }}
          WEBBY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WEBBY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WEBBY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android-panel
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            gradle --no-daemon --stacktrace assembleRelease
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Name the artifact
        id: artifact
        run: |
          set -euo pipefail
          apk="$(find android-panel/app/build/outputs/apk -name '*.apk' | head -n 1)"
          test -n "$apk"
          version="$(sed -n 's/.*versionName = "\(.*\)"/\1/p' android-panel/app/build.gradle.kts | head -n 1)"
          name="webby-panel-${version}.apk"
          cp "$apk" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || format('panel-v{0}', steps.artifact.outputs.version) }}
          name: Webby Panel ${{ steps.artifact.outputs.version }}
          prerelease: true
          files: ${{ steps.artifact.outputs.name }}
          body: |
            Android wrapper for the Webby control panel.

            The app serves the web panel from inside itself, on
            `http://127.0.0.1:8788`, and opens it in a WebView. That loopback
            origin is what makes it behave as a PWA: the manifest resolves, the
            service worker registers, and the panel's settings persist.

            - Simulated mode works offline: the panel runs its in-tab TeamTalk
              server model with every tool ported from the Python suite.
            - Live mode needs a bridge on your network. Run `./run_webby.sh start`
              on a desktop, then set that address under **Bridge** in the app.
              The Python bridge cannot run on Android.

            Install by downloading the APK on the device and allowing installs
            from unknown sources.

            ${{ steps.keystore.outputs.signed == 'true' && '**Signed** with the release keystore.' || '**Debug-signed** — installable, but expect the usual unknown-developer warning. Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets to produce a release-signed APK instead.' }}

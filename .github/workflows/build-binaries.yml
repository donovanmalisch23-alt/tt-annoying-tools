name: Build binaries

# Build standalone Windows (.exe) and Linux executables for the TeamTalk
# tools with PyInstaller, then publish them to the GitHub Releases tab.
#
# The TeamTalk 5 SDK is downloaded per platform and bundled into each
# executable so the result runs without a separate SDK install.  The public
# SDK is a 30-day trial; a licensed SDK is needed for a permanent build (swap
# the SDK URLs below to the Pro edition if required).
#
# Releases:
#   * push to main / workflow_dispatch  -> refresh a rolling "latest" release
#   * push of a v* tag                   -> a versioned release for that tag

on:
  workflow_dispatch:
  push:
    # A push to main refreshes the rolling "latest" release; pushing a v* tag
    # creates a versioned release.  (branches + tags both under one push key:
    # the workflow runs when either matches.)
    branches: [main]
    tags: ['v*']

permissions:
  contents: write   # required to create releases / tags

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: tt-linux-x86_64
            sdk_urls: |
              https://www.bearware.dk/teamtalksdk/v5.22a/tt5sdk_v5.22a_ubuntu22_x86_64.7z
              https://bearware.dk/teamtalksdk/v5.22a/tt5sdk_v5.22a_ubuntu22_x86_64.7z
          - os: windows-latest
            artifact: tt-windows-x64
            sdk_urls: |
              https://www.bearware.dk/teamtalksdk/v5.22a/tt5sdk_v5.22a_win64.7z
              https://bearware.dk/teamtalksdk/v5.22a/tt5sdk_v5.22a_win64.7z
              https://www.bearware.dk/teamtalksdk/v5.22a/tt5sdk_v5.22a_win32.7z
              https://bearware.dk/teamtalksdk/v5.22a/tt5sdk_v5.22a_win32.7z
              https://www.bearware.dk/teamtalksdk/v5.22a/tt5sdk_v5.22a_win64.zip
              https://bearware.dk/teamtalksdk/v5.22a/tt5sdk_v5.22a_win64.zip
              https://www.bearware.dk/teamtalksdk/v5.22a/tt5sdk_v5.22a_win32.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install 7-Zip (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Download and extract TeamTalk SDK
        shell: bash
        run: |
          set -e
          downloaded=0
          # Default IFS read trims the leading whitespace that the YAML
          # block-scalar indentation bakes into each candidate URL.
          while read -r url; do
            url="${url%"${url##*[![:space:]]}"}"   # strip trailing whitespace
            [ -z "$url" ] && continue
            echo "Trying SDK URL: $url"
            if curl -fSL --connect-timeout 20 --retry 2 -o sdk_archive "$url"; then
              downloaded=1
              echo "Downloaded from: $url"
              break
            fi
            echo "URL failed: $url"
          done <<'URLS'
          ${{ matrix.sdk_urls }}
          URLS
          if [ "$downloaded" != "1" ]; then
            echo "ERROR: could not download the TeamTalk SDK from any candidate URL." >&2
            exit 1
          fi
          # The archive may be .7z or .zip; 7z handles both.
          7z x sdk_archive -osdk_ci -y
          echo "Extracted SDK tree:"
          find sdk_ci -maxdepth 3 | head -60

      - name: Set TEAMTALK_SDK_PATH
        shell: bash
        run: |
          # Prefer the directory that contains the Library/ subtree (SDK root).
          root="$(find sdk_ci -type d -name Library -printf '%h\n' | head -1)"
          if [ -z "$root" ]; then
            # Fall back to the directory that contains TeamTalk5.py.
            root="$(find sdk_ci -name TeamTalk5.py -printf '%h\n' | head -1)"
          fi
          if [ -z "$root" ]; then
            echo "Could not locate the SDK root." >&2
            exit 1
          fi
          echo "SDK root: $root"
          echo "TEAMTALK_SDK_PATH=$root" >> "$GITHUB_ENV"

      - name: Build executables
        run: python build_binaries.py

      - name: Package binaries
        shell: bash
        run: |
          set -e
          mkdir -p release
          if [ "${{ runner.os }}" = "Windows" ]; then
            archive="release/${{ matrix.artifact }}.zip"
            7z a -tzip "$archive" ./dist/*
          else
            archive="release/${{ matrix.artifact }}.tar.gz"
            tar -czf "$archive" -C dist .
          fi
          echo "Packaged: $archive"
          ls -la release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "name=Latest build" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Inspect assets
        shell: bash
        run: |
          set -e
          echo "Downloaded assets:"
          find assets -type f | sort
          ls -la assets

      - name: Create / update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"; NAME="$TAG"
          else
            TAG="latest"; NAME="Latest build"
          fi

          # Build the release notes (commit SHA expanded in the echo lines; the
          # backtick-heavy body is in a quoted heredoc so nothing is re-evaluated).
          {
            echo "## TeamTalk Annoying Tools — $NAME"
            echo ""
            echo "Standalone Windows and Linux executables built from commit $GITHUB_SHA."
            echo ""
            cat <<'NOTES'
          ### Windows (x64)
          Download **`tt-windows-x64.zip`**, extract it, and run any of the
          `.exe` tools (`tt-suite.exe`, `tt-spammer.exe`, `tt-message-spammer.exe`,
          `tt-leave-join-spammer.exe`, `ttbot-the-offender.exe`). Each bundles the
          TeamTalk 5 SDK, so no separate SDK install is needed. On first run you
          will be prompted to accept the TeamTalk 5 SDK license terms (Y/N).

          ### Linux (x86_64)
          Download **`tt-linux-x86_64.tar.gz`**, extract it, and run the
          executables the same way.

          ### SDK trial note
          The bundled SDK runs in TRAIL MODE and self-disables after 30 days of
          use. Re-download a fresh build (with a newer SDK) to reset the window,
          or supply your own TeamTalk SDK license via `TT_LICENSE_NAME` /
          `TT_LICENSE_KEY`.
          NOTES
          } > /tmp/notes.md

          # Retry helper: outlasts transient GitHub Releases-API 503s
          # ("No server is currently available to service your request").
          retry() {
            local attempts="$1" delay="$2"; shift 2
            local i
            for i in $(seq 1 "$attempts"); do
              if "$@"; then return 0; fi
              echo "::warning::Attempt $i/$attempts failed; retrying in ${delay}s..." >&2
              [ "$i" -lt "$attempts" ] && sleep "$delay"
            done
            return 1
          }

          # Best-effort: clear an existing rolling release (including drafts) so
          # we create fresh.  `gh release delete` by tag skips drafts, so look
          # the release up by ID via the API first.
          EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG"                        --jq '.id' 2>/dev/null || true)"
          if [ -z "$EXISTING" ]; then
            EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/releases"                          --jq "[.[] | select(.tag_name==\"$TAG\")] | first | .id // empty" 2>/dev/null || true)"
          fi
          if [ -n "$EXISTING" ]; then
            echo "Removing existing release (id=$EXISTING) for tag $TAG"
            retry 5 10 gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$EXISTING" || true
            retry 5 10 git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
                   ":refs/tags/$TAG" 2>/dev/null || true
          fi

          # Create the published release, retrying through transient 5xx.
          if ! retry 10 20 gh release create "$TAG" \
                  --title "$NAME" --latest --target "$GITHUB_SHA" \
                  --notes-file /tmp/notes.md; then
            echo "::error::Could not create release $TAG after retries" >&2
            exit 1
          fi

          # Upload each asset independently with retries.
          shopt -s nullglob
          fail=0
          for asset in assets/*; do
            if ! retry 10 15 gh release upload "$TAG" "$asset" --clobber; then
              echo "::error::Failed to upload $asset after retries" >&2
              fail=1
            fi
          done
          exit "$fail"
